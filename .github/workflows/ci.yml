name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: https://hackbattle26-backend-1.onrender.com
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDummyKeyForCIValidation123456789
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: redefine-26.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: redefine-26
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: redefine-26.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "194484000895"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:194484000895:web:05fa6771a0c9d2b40d874a"
